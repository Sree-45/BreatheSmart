# Tests run against in-memory H2 (MySQL compatibility mode) so they don't need a
# running MySQL. Overrides the main datasource on the test classpath.
spring.datasource.url=jdbc:h2:mem:breathesmart;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
