# Pin servlet stack — webflux is on the classpath only for WebClient.
spring.main.web-application-type=servlet

# Google Maps / Air Quality key (server-side AQI proxy). Placeholder — replace with
# your key, or set the GOOGLE_MAPS_API_KEY env var (no .env file required).
google.maps.api.key=${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY}
# MySQL (local). Defaults to root/root — override via env (SPRING_DATASOURCE_URL,
# MYSQL_USER, MYSQL_PASSWORD) if your local MySQL differs. The schema is created
# automatically (Hibernate ddl-auto=update + createDatabaseIfNotExist), so nmake o
# manual table setup is needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/breathesmart?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=true
spring.jpa.show-sql=false
# RAG service (Python FastAPI)
rag.service.base-url=${RAG_SERVICE_BASE_URL:http://localhost:8000}

# JWT Settings
jwt.secret=${JWT_SECRET:YOUR_JWT_SECRET}
jwt.expiration=86400000

# Spring AI -> Groq via its OpenAI-compatible endpoint.
# Placeholder — replace with your key, or set the GROQ_API_KEY env var (no .env needed).
spring.ai.openai.api-key=${GROQ_API_KEY:YOUR_GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.3

# File upload (health reports)
app.uploads.dir=${APP_UPLOADS_DIR:./uploads/reports}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

server.port=8081