# Pin servlet stack — webflux is on the classpath only for WebClient.
spring.main.web-application-type=servlet

google.maps.api.key=${GOOGLE_MAPS_API_KEY}
spring.data.mongodb.uri=mongodb+srv://sreeshanthkandagatla2005:<db_password>@cluster0.doxry.mongodb.net/breathesmart?retryWrites=true&w=majority&appName=Cluster0

# RAG service (Python FastAPI)
rag.service.base-url=http://localhost:8000

# JWT Settings
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Gemini AI Settings
gemini.api.key=${GEMINI_API_KEY}
gemini.project.id=breathesmart-ai
gemini.location=us-central1
gemini.model.name=gemini-2.5-pro

# Spring AI -> Gemini via OpenAI-compatible endpoint
# (Same Gemini API key works; no GCP credentials needed.)
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=${gemini.model.name}
spring.ai.openai.chat.options.temperature=0.3

# File upload (health reports)
app.uploads.dir=./uploads/reports
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB