services:

  mysql:
    image: mysql:8.4
    container_name: breathe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: breathesmart
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [breathe-net]

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: breathe-rag
    restart: unless-stopped
    environment:
      # LLM (Groq) + Google Maps keys are hardcoded in app/config.py for now, so no env needed.
      CHROMA_DB_PATH: /app/chroma_db
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      UVICORN_RELOAD: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,https://localhost:5173,http://backend:8081
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - ./rag-service/data:/app/data:ro
    networks: [breathe-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: breathe-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rag-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/breathesmart?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      RAG_SERVICE_BASE_URL: http://rag-service:8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # LLM (Groq) key/model are hardcoded in application.properties for now, so no env needed.
      APP_UPLOADS_DIR: /app/uploads/reports
    ports:
      - "8081:8081"
    volumes:
      - backend_uploads:/app/uploads
    networks: [breathe-net]

networks:
  breathe-net:
    driver: bridge

volumes:
  mysql_data:
  chroma_data:
  backend_uploads:
