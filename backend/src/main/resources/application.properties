# Pin servlet stack — webflux is on the classpath only for WebClient.
spring.main.web-application-type=servlet

# Google Maps / Air Quality key (server-side AQI proxy). Placeholder — replace with
# your key, or set the GOOGLE_MAPS_API_KEY env var (no .env file required).
google.maps.api.key=${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/breathesmart}
# RAG service (Python FastAPI)
rag.service.base-url=${RAG_SERVICE_BASE_URL:http://localhost:8000}

# JWT Settings
jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret}
jwt.expiration=86400000

# Spring AI -> Groq via its OpenAI-compatible endpoint.
# Placeholder — replace with your key, or set the GROQ_API_KEY env var (no .env needed).
spring.ai.openai.api-key=${GROQ_API_KEY:YOUR_GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.3

# File upload (health reports)
app.uploads.dir=${APP_UPLOADS_DIR:./uploads/reports}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB